<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="60" y="28" font-size="17" font-weight="600" fill="#1f2328">One fight, D deciders: tick time versus bodies (median, Python fixture, one machine)</text>
  <text x="60" y="48" font-size="12" fill="#656d76">Every run checked bit-for-bit against the single decider. 30 Hz budget = 33.3 ms.</text>
  <!-- axes -->
  <line x1="60" y1="380" x2="720" y2="380" stroke="#8c959f" stroke-width="1"/>
  <line x1="60" y1="50" x2="60" y2="380" stroke="#8c959f" stroke-width="1"/>
  <!-- y grid -->
  <g stroke="#e6e8eb" stroke-width="1">
    <line x1="60" y1="285.7" x2="720" y2="285.7"/>
    <line x1="60" y1="191.4" x2="720" y2="191.4"/>
    <line x1="60" y1="97.1" x2="720" y2="97.1"/>
  </g>
  <g font-size="11" fill="#656d76" text-anchor="end">
    <text x="54" y="384">0</text>
    <text x="54" y="289.7">10</text>
    <text x="54" y="195.4">20</text>
    <text x="54" y="101.1">30</text>
    <text x="54" y="70">ms</text>
  </g>
  <!-- budget line -->
  <line x1="60" y1="66" x2="720" y2="66" stroke="#cf222e" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="716" y="61" font-size="11" fill="#cf222e" text-anchor="end">33.3 ms tick budget</text>
  <!-- x ticks -->
  <g font-size="11" fill="#656d76" text-anchor="middle">
    <text x="126" y="398">2,000</text>
    <text x="225" y="398">5,000</text>
    <text x="390" y="398">10,000</text>
    <text x="720" y="398">20,000</text>
    <text x="390" y="420">bodies in the fight (N)</text>
  </g>
  <!-- D = 1 -->
  <polyline fill="none" stroke="#1f2328" stroke-width="2.5" points="126,369.5 225,347.6 390,294.2 720,188.5"/>
  <!-- D = 2 -->
  <polyline fill="none" stroke="#0969da" stroke-width="2.5" points="126,371.1 225,359.0 390,335.8 720,272.0"/>
  <!-- D = 4 -->
  <polyline fill="none" stroke="#1a7f37" stroke-width="2.5" points="126,371.4 225,363.2 390,349.3 720,309.4"/>
  <!-- D = 8 -->
  <polyline fill="none" stroke="#8250df" stroke-width="2.5" points="126,366.0 225,359.4 390,346.0 720,319.7"/>
  <g fill="#1f2328"><circle cx="126" cy="369.5" r="3"/><circle cx="225" cy="347.6" r="3"/><circle cx="390" cy="294.2" r="3"/><circle cx="720" cy="188.5" r="3"/></g>
  <g fill="#0969da"><circle cx="126" cy="371.1" r="3"/><circle cx="225" cy="359.0" r="3"/><circle cx="390" cy="335.8" r="3"/><circle cx="720" cy="272.0" r="3"/></g>
  <g fill="#1a7f37"><circle cx="126" cy="371.4" r="3"/><circle cx="225" cy="363.2" r="3"/><circle cx="390" cy="349.3" r="3"/><circle cx="720" cy="309.4" r="3"/></g>
  <g fill="#8250df"><circle cx="126" cy="366.0" r="3"/><circle cx="225" cy="359.4" r="3"/><circle cx="390" cy="346.0" r="3"/><circle cx="720" cy="319.7" r="3"/></g>
  <!-- labels -->
  <g font-size="12" font-weight="600">
    <text x="640" y="180" fill="#1f2328">1 decider · 20.3 ms</text>
    <text x="640" y="266" fill="#0969da">2 deciders · 11.5 ms</text>
    <text x="640" y="305" fill="#1a7f37">4 deciders · 7.5 ms</text>
    <text x="640" y="340" fill="#8250df">8 deciders · 6.4 ms</text>
  </g>
  <text x="128" y="358" font-size="11" fill="#656d76">crossover: 2 deciders beat 1 from N ≈ 1,100</text>
</svg>
